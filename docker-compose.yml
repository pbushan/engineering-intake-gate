services:
  intake-gate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OperationalDatabase__Path: /app/data/intake-gate.db
      Authentication__DataProtectionKeyPath: /app/data/data-protection-keys
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - intake-gate-product-data:/app/data
    healthcheck:
      test: ["CMD", "dotnet", "IntakeGate.Host.dll", "--health-check"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  intake-gate-ui:
    build:
      context: ./src/IntakeGate.Web
      dockerfile: Dockerfile
    ports:
      - "${INTAKE_GATE_PORT:-8080}:8080"
    depends_on:
      intake-gate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/ui-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

volumes:
  intake-gate-product-data:
